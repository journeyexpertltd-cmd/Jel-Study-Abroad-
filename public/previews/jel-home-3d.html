<style>
:root{--ink:#06201E;--forest:#0B5D3B;--deep:#083F28;--moss:#2A8460;--gold:#B8912F;--gold2:#D9B44A;--paper:#F4F6F1;--paper2:#EAEEE6;--mist:#D9E5DD;--white:#fff;--blue:#0b7fa8;--radius:22px;--shadow:0 24px 70px rgba(6,32,30,.13)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#fbfcf8 0%,#f4f6f1 60%,#edf2ec 100%);color:var(--ink);font-family:Karla,"Hind Siliguri",Arial,sans-serif;overflow-x:hidden}a{text-decoration:none;color:inherit}button{font:inherit}.wrap{max-width:1440px;margin:auto;padding:0 clamp(18px,4vw,58px)}
.preview-ribbon{position:fixed;z-index:99;right:14px;bottom:14px;background:#071d1b;color:#fff;border:1px solid rgba(255,255,255,.15);padding:10px 14px;border-radius:999px;font-size:11px;letter-spacing:.08em;box-shadow:0 12px 34px rgba(0,0,0,.25)}
header{position:sticky;top:0;z-index:60;background:rgba(250,252,248,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(6,32,30,.08)}.top{height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:12px;min-width:245px}.brand img{width:82px;height:auto;filter:drop-shadow(0 6px 10px rgba(6,32,30,.08))}.brand strong{display:block;font-family:Georgia,serif;font-size:18px}.brand small{font-size:10px;color:#53625c}.nav{display:flex;gap:22px;align-items:center;font-size:13px;font-weight:700}.nav a{padding:10px 0;border-bottom:2px solid transparent}.nav a:hover{border-color:var(--gold)}.book{background:linear-gradient(135deg,var(--forest),#06432d);color:#fff;padding:13px 20px;border-radius:12px;box-shadow:0 10px 24px rgba(11,93,59,.22)}
.hero{position:relative;min-height:690px;display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:20px;overflow:hidden;padding:58px 0 34px}.hero:before{content:"";position:absolute;inset:-15% 35% 20% -15%;background:radial-gradient(circle at 40% 50%,rgba(217,180,74,.16),transparent 48%);pointer-events:none}.hero-copy{position:relative;z-index:3;max-width:720px}.kicker{display:inline-flex;gap:9px;align-items:center;font-size:11px;letter-spacing:.19em;text-transform:uppercase;font-weight:800;color:#6f622f}.kicker i{width:26px;height:1px;background:var(--gold)}h1{font-family:Georgia,"Hind Siliguri",serif;font-size:clamp(43px,5.7vw,80px);line-height:1.01;letter-spacing:-.035em;margin:24px 0 16px;max-width:820px}.bn-sub{font-family:"Hind Siliguri",Arial,sans-serif;font-size:clamp(22px,2.2vw,34px);line-height:1.32;margin:0 0 17px;color:#1a3630}.hero-copy p{font-size:17px;line-height:1.68;max-width:650px;color:#45554f}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 22px;border-radius:12px;font-weight:800;font-size:14px;border:1px solid rgba(6,32,30,.18);transition:.22s ease}.btn.primary{background:var(--forest);color:#fff;border-color:var(--forest)}.btn.secondary{background:rgba(255,255,255,.68)}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(6,32,30,.13)}.micro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:680px}.micro div{padding:13px 12px;border:1px solid rgba(6,32,30,.08);background:rgba(255,255,255,.62);border-radius:14px}.micro b{font-size:12px}.micro span{display:block;font-size:10px;color:#60716b;margin-top:3px}
.scene{position:relative;height:600px;perspective:1000px}.scene-card{position:absolute;inset:28px 0 18px 0;border-radius:34px;overflow:hidden;background:radial-gradient(circle at 55% 42%,#125e64 0,#07313e 34%,#061b25 68%,#04161c 100%);box-shadow:0 40px 90px rgba(3,26,29,.34);border:1px solid rgba(217,180,74,.32);transform-style:preserve-3d}.scene-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 25%,transparent 74%,rgba(217,180,74,.14));pointer-events:none}.gridlines{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,transparent,black 14%,black 80%,transparent)}#globe{position:absolute;inset:0;width:100%;height:100%}.globe-fallback{position:absolute;inset:13% 9%;border-radius:50%;border:1px solid rgba(217,180,74,.6);display:none;background:radial-gradient(circle at 40% 35%,rgba(28,122,82,.4),rgba(6,32,30,.1) 52%,transparent 54%)}.globe-fallback:after{content:"";position:absolute;inset:16%;border:1px dashed rgba(217,180,74,.55);border-radius:50%}.logo-float{position:absolute;left:7%;top:7%;width:150px;padding:13px;border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 20px 45px rgba(0,0,0,.24);transform:translateZ(70px) rotate(-3deg)}.logo-float img{display:block;width:100%}.scene-title{position:absolute;left:8%;bottom:10%;color:white;max-width:330px;transform:translateZ(45px)}.scene-title small{letter-spacing:.15em;text-transform:uppercase;color:#d8c887}.scene-title h2{font-family:Georgia,serif;font-size:35px;line-height:1.05;margin:8px 0}.scene-title p{font-size:12px;color:#b9d4cc;line-height:1.55}.orbit-chip{position:absolute;color:#fff;background:rgba(6,32,30,.62);backdrop-filter:blur(10px);border:1px solid rgba(217,180,74,.32);padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800;box-shadow:0 12px 25px rgba(0,0,0,.18)}.c1{right:8%;top:16%}.c2{right:4%;top:43%}.c3{right:11%;bottom:16%}.plane{position:absolute;right:17%;top:24%;font-size:54px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3));animation:plane 8s ease-in-out infinite}.seal{position:absolute;right:7%;bottom:6%;width:106px;height:106px;border-radius:50%;display:grid;place-items:center;color:#fff;text-align:center;font-family:Georgia,serif;font-weight:700;border:2px solid var(--gold2);outline:5px double rgba(217,180,74,.5);background:radial-gradient(circle,#0c704b,#063a28);box-shadow:0 20px 35px rgba(0,0,0,.25);animation:seal 12s linear infinite}.seal span{font-size:12px;line-height:1.15}.seal b{display:block;font-size:24px;color:#efd276}
.trust{background:linear-gradient(90deg,#063524,#0b5d3b 60%,#165f47);color:#fff;margin:4px 0 52px}.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr) 1.2fr;align-items:stretch;padding-top:0;padding-bottom:0}.trust-item{padding:24px 18px;border-right:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:13px}.trust-icon{width:43px;height:43px;border-radius:50%;border:1px solid var(--gold2);display:grid;place-items:center;color:#efd276;font-size:18px}.trust-item strong{display:block;font-size:14px}.trust-item small{font-size:10px;color:#c6d8d0}.trust-gold{background:linear-gradient(135deg,#dfbd61,#b98a26);color:#13211c;padding:20px 24px;display:flex;flex-direction:column;justify-content:center}.trust-gold b{font-family:Georgia,serif;font-size:20px}
section.block{padding:46px 0}.section-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:22px}.section-head h2{font-family:Georgia,serif;font-size:36px;margin:0}.section-head p{margin:7px 0 0;color:#65736e;font-size:13px}.section-head a{font-weight:800;font-size:12px;border-bottom:1px solid var(--forest)}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.dest{min-height:230px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 10px 28px rgba(6,32,30,.08);border:1px solid rgba(6,32,30,.08);position:relative}.dest .pic{height:160px;background-size:cover;background-position:center;transition:transform .42s ease}.dest:hover .pic{transform:scale(1.035)}.dest .info{padding:12px 13px}.dest b{font-size:14px}.dest small{display:block;color:#6a7772;font-size:10px;margin-top:4px}.flag{position:absolute;right:10px;top:10px;font-size:27px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.split{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service{padding:21px;border-radius:16px;background:#fff;border:1px solid rgba(6,32,30,.08);min-height:150px}.ico{width:42px;height:42px;border-radius:12px;background:#e7f1eb;color:var(--forest);display:grid;place-items:center;font-size:19px;margin-bottom:13px}.service b{font-size:14px}.service p{font-size:11px;line-height:1.5;color:#66736e}.angela{position:relative;overflow:hidden;border-radius:22px;color:white;background:radial-gradient(circle at 78% 45%,#16765d,#073a31 47%,#052721 76%);min-height:336px;padding:29px}.angela:after{content:"AI";position:absolute;right:-10px;bottom:-44px;font-family:Georgia,serif;font-size:190px;color:rgba(255,255,255,.055);font-weight:900}.angela h3{font-family:Georgia,serif;font-size:31px;margin:0 0 7px}.angela p{font-size:12px;color:#bdd9d0}.ai-orb{position:absolute;right:28px;top:32px;width:122px;height:122px;border-radius:50%;border:1px solid rgba(217,180,74,.5);box-shadow:0 0 0 12px rgba(217,180,74,.06),0 0 60px rgba(0,238,187,.24);display:grid;place-items:center;font-size:40px;animation:pulse 3s ease-in-out infinite}.angela ul{padding:0;margin:27px 0;list-style:none;font-size:12px;line-height:2}.angela li:before{content:"✓";color:#f1d26f;margin-right:8px}.angela .btn{background:#fff;color:#063524;border:0;padding:12px 17px}
.tools-journey{display:grid;grid-template-columns:.85fr 1.15fr;gap:26px;align-items:start}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tool{background:#fff;border:1px solid rgba(6,32,30,.09);border-radius:16px;padding:19px;min-height:170px}.tool b{font-size:13px}.tool p{font-size:10px;color:#65736e;line-height:1.5}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:19px}.step{text-align:center;position:relative}.step:not(:last-child):after{content:"→";position:absolute;right:-9px;top:12px;color:var(--gold);font-size:19px}.num{width:34px;height:34px;margin:auto;border-radius:50%;background:linear-gradient(#efd276,#c89b2f);display:grid;place-items:center;font-family:Georgia,serif;font-weight:900}.step b{display:block;font-size:10px;margin-top:9px}.step small{display:block;font-size:9px;color:#687670;margin-top:4px;line-height:1.4}
.cta{margin:40px 0 0;border-radius:25px;overflow:hidden;background:linear-gradient(105deg,#063a2a,#0b5d3b 58%,#d6b052 58%,#f1d887 100%);color:#fff;display:grid;grid-template-columns:1.5fr .5fr;align-items:center;padding:35px 40px;box-shadow:var(--shadow)}.cta h2{font-family:Georgia,serif;font-size:38px;margin:0}.cta p{font-size:13px;color:#c6d9d2}.cta .btn{justify-self:end;background:#fff;color:#073a2b;border:0}
footer{margin-top:58px;background:#f8faf6;border-top:1px solid rgba(6,32,30,.09)}.footer-grid{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:42px;padding:44px 0}.footer-grid h4{font-family:Georgia,serif;margin:0 0 13px}.footer-grid p,.footer-grid a{display:block;font-size:11px;color:#5e6c67;line-height:1.85}.footer-logo{width:150px}.footbar{background:#063a2a;color:#dce8e2;padding:15px 0;font-size:10px}.footbar .wrap{display:flex;justify-content:space-between;gap:15px}

@media(max-width:980px){.nav{display:none}.hero{grid-template-columns:1fr;min-height:auto}.scene{height:540px}.trust .wrap{grid-template-columns:repeat(2,1fr)}.trust-gold{grid-column:1/-1}.cards{grid-template-columns:repeat(3,1fr)}.split,.tools-journey{grid-template-columns:1fr}.cta{grid-template-columns:1fr;gap:15px}.cta .btn{justify-self:start}.footer-grid{grid-template-columns:1fr 1fr}}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.plane,.seal,.ai-orb{animation:none!important}.btn,.dest .pic{transition:none!important}}
</style>
