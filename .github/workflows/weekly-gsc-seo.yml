name: Weekly GSC and SEO Audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install --upgrade google-api-python-client google-auth requests

      - name: Run weekly Search Console and SEO audit
        env:
          GSC_SITE_URL: sc-domain:journeyexpertbd.com
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/weekly-gsc-seo.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-gsc-seo-report
          path: weekly-seo-report.json
          if-no-files-found: warn
          retention-days: 90
