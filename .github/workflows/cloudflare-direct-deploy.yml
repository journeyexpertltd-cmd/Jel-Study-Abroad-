name: Cloudflare Direct Pages Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-direct-deploy.yml"
      - "functions/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: jel-study-abroad-cloudflare-direct
  cancel-in-progress: false

jobs:
  deploy:
    name: Direct deploy jel-study-abroad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "7b0d4036973a06b9cd4622770748a101"

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source
        run: npm run lint

      - name: Verify Angela production contract
        run: node scripts/verify-production-contract.mjs

      - name: Build production artifacts
        run: npm run build

      - name: Detect Cloudflare deployment credentials
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare direct-deploy credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare direct deploy skipped because CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
          fi

      - name: Deploy preview through Wrangler
        if: steps.cf.outputs.available == 'true'
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          npx --yes wrangler@4 pages deploy dist             --project-name=jel-study-abroad             --branch=direct-health-fix             --commit-hash="$GITHUB_SHA" 2>&1 | tee "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "$log" | tail -n1 || true)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview Functions
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.preview.outputs.url }}"
          body="$(curl --fail --silent --show-error --max-time 30 "$url/api/health")"
          echo "$body" | jq -e '.ok == true'
          echo "$body" | jq -e '.service == "jel-study-abroad-api"'
          echo "$body" | jq -e '.checks.supabase == true'
          echo "$body" | jq -e 'has("optional")'

      - name: Deploy production through Wrangler
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist             --project-name=jel-study-abroad             --branch=main             --commit-hash="$GITHUB_SHA"

      - name: Verify public production health
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          body="$(curl --fail --silent --show-error --max-time 30 https://journeyexpertbd.com/api/health)"
          echo "$body" | jq -e '.ok == true'
          echo "$body" | jq -e '.checks.gemini == true'
          echo "$body" | jq -e '.checks.supabase == true'
          echo "$body" | jq -e '.configured == true'
          echo "$body" | jq -e 'has("optional")'

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloudflare Direct Pages Deploy"
            echo '- Project: jel-study-abroad'
            echo "- Source: $GITHUB_SHA"
            echo "- Direct-deploy credentials available: ${{ steps.cf.outputs.available || 'unknown' }}"
            echo "- Safety: source validation and build run before any deployment."
            echo "- Safety: preview Functions smoke test must pass before production deployment."
            echo "- Existing DNS, custom domains, bindings, and dashboard variables are not modified by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
