name: Cloudflare Direct Pages Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-direct-deploy.yml"
      - "functions/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: jel-study-abroad-cloudflare-direct
  cancel-in-progress: false

jobs:
  deploy:
    name: Direct deploy jel-study-abroad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "7b0d4036973a06b9cd4622770748a101"

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source
        run: npm run lint

      - name: Verify Angela production contract
        run: node scripts/verify-production-contract.mjs

      - name: Build production artifacts
        run: npm run build

      - name: Validate optional Cloudflare direct-deploy token
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Direct Wrangler deploy is disabled because no Cloudflare API token is configured. The connected Cloudflare Pages Git integration remains the canonical wallet-free deployment path."
            exit 0
          fi

          verify="$(curl --silent --show-error --max-time 20             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             https://api.cloudflare.com/client/v4/user/tokens/verify || true)"

          if jq -e '.success == true and .result.status == "active"' >/dev/null 2>&1 <<<"$verify"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare direct-deploy token is active."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare direct-deploy token is absent, expired, or invalid. Skipping Wrangler direct upload; connected Cloudflare Pages Git integration remains the canonical wallet-free deployment path."
          fi

      - name: Deploy preview through Wrangler
        if: steps.cf.outputs.available == 'true'
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          npx --yes wrangler@4 pages deploy dist             --project-name=jel-study-abroad             --branch=direct-health-fix             --commit-hash="$GITHUB_SHA" 2>&1 | tee "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "$log" | tail -n1 || true)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview Functions
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.preview.outputs.url }}"
          body="$(curl --fail --silent --show-error --max-time 30 "$url/api/health")"
          echo "$body" | jq -e '.ok == true'
          echo "$body" | jq -e '.service == "jel-study-abroad-api"'
          echo "$body" | jq -e '.checks.supabase == true'
          echo "$body" | jq -e 'has("optional")'

      - name: Deploy production through Wrangler
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist             --project-name=jel-study-abroad             --branch=main             --commit-hash="$GITHUB_SHA"

      - name: Verify canonical production health
        shell: bash
        run: |
          set -euo pipefail
          # This custom-domain verification runs whether deployment came from
          # Wrangler or the connected Cloudflare Pages Git integration.
          for attempt in 1 2 3 4 5 6; do
            if body="$(curl --fail --silent --show-error --max-time 30 "https://journeyexpertbd.com/api/health?deploy_check=$GITHUB_SHA")"; then
              if echo "$body" | jq -e '.ok == true and .checks.gemini == true and .checks.supabase == true and .configured == true' >/dev/null; then
                echo "Canonical production health is good."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Canonical production health did not become healthy within the bounded verification window."
          exit 1

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloudflare Pages Deploy"
            echo "- Project: jel-study-abroad"
            echo "- Source: $GITHUB_SHA"
            echo "- Wrangler direct-deploy token active: ${{ steps.cf.outputs.available || 'unknown' }}"
            echo "- Primary wallet-free path: connected Cloudflare Pages Git integration on main."
            echo "- Optional path: Wrangler direct upload only when the stored token verifies as active."
            echo "- Safety: source validation, Angela production contract, and production build run before deployment checks."
            echo "- Existing DNS, custom domains, bindings, and dashboard variables are not modified by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
