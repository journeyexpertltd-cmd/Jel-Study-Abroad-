name: Apply Angela Language Voice Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-angela-language-voice.mjs
      - name: Validate
        run: |
          npm ci
          npm run lint
          node --experimental-strip-types --test tests/angela-pages-chat.test.mjs tests/angela-speech.test.mjs
          npm run check:seo
          npm run build
      - name: Commit source change
        run: |
          if git diff --quiet -- src/components/AIChatAssistant.tsx; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AIChatAssistant.tsx
          git commit -m "fix: stabilize Angela Bangla and Auto voice"
          git push origin HEAD:main
