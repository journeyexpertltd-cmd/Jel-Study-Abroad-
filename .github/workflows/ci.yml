name: Study Abroad CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-abroad-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check application
        run: npm run lint

      - name: Test Pages APIs and security contracts
        run: node --experimental-strip-types --test tests/angela-pages-chat.test.mjs tests/angela-speech.test.mjs tests/angela-live-token.test.mjs tests/angela-transcribe.test.mjs tests/security-contract.test.mjs tests/health-endpoint.test.mjs

      - name: Run SEO and domain safety checks
        run: npm run check:seo

      - name: Verify protected production contract
        run: node scripts/verify-production-contract.mjs

      - name: Build production artifacts
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/server.cjs
          test -f dist/about/index.html
          test -f dist/ects-calculator/index.html
          test -f dist/jel-3d-preview.html
          grep -q 'noindex,nofollow,noarchive' dist/jel-3d-preview.html
          grep -q 'JEL Study Abroad' dist/jel-3d-preview.html
          grep -q 'https://journeyexpertbd.com/about"' dist/about/index.html
          grep -q 'https://journeyexpertbd.com/ects-calculator"' dist/ects-calculator/index.html
          ! grep -q 'https://journeyexpertbd.com/about/' dist/about/index.html
          ! grep -q 'https://journeyexpertbd.com/ects-calculator/' dist/ects-calculator/index.html
          ! grep -RInE 'journeyexpertlimited\.com' dist index.html public
          ! grep -RInE 'canonical[^>]*journeyexpertltd\.com|journeyexpertltd\.com[^>]*canonical' dist --include='*.html'

      - name: Publish CI summary
        if: always()
        run: |
          {
            echo "## Study Abroad CI"
            echo ""
            echo "- Repository: \`${{ github.repository }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- Build command: \`npm run build\`"
            echo "- Production target: \`https://journeyexpertbd.com\`"
            echo "- 3D preview artifact: \`dist/jel-3d-preview.html\` verified."
            echo "- Angela voice contract: protected by automated regression checks."
            echo "- CRM/student auth: protected by security contract tests."
            echo "- Canonical URL contract: no trailing slash except the homepage."
            echo "- Cloudflare deployment: triggered by the connected Pages GitHub integration after a successful push to \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
