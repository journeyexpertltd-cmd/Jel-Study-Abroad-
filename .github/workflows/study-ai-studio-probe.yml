name: Study AI Studio route probe

on:
  push:
    branches:
      - diag/study-ai-studio-route-20260921
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe dedicated Study Abroad AI Studio routes
        shell: bash
        run: |
          set -u
          origin="https://jel-study-abroad.ai.studio"
          root_status="$(curl --silent --show-error --location --max-time 15 --output /dev/null --write-out '%{http_code}' "$origin/" || true)"
          echo "root_status=$root_status"
          for path in /api/gemini/chat /api/ai/voice-agent; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 --header 'Content-Type: application/json' --header 'Origin: https://journeyexpertbd.com' --data '{"message":"ami UK te masters korte chai, ki documents lagbe?","language":"auto","history":[]}' --output "$body" --write-out '%{http_code}' "$origin$path" || true)"
            echo "$path status=$status"
            if jq -e . "$body" >/dev/null 2>&1; then
              mode="$(jq -r '.mode // ""' "$body")"
              language="$(jq -r '.language // ""' "$body")"
              reply="$(jq -r '.reply // .response // ""' "$body")"
              bytes="$(wc -c < "$body" | tr -d ' ')"
              if grep -Pq '[\x{0980}-\x{09FF}]' <<< "$reply"; then has_bangla=true; else has_bangla=false; fi
              echo "$path json=true mode=$mode language=$language reply_len=${#reply} has_bangla=$has_bangla bytes=$bytes"
            else
              echo "$path json=false bytes=$(wc -c < "$body" | tr -d ' ')"
            fi
            rm -f "$body"
          done
