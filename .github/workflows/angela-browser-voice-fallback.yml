name: Patch Angela Browser Voice Fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Angela voice fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/AIChatAssistant.tsx')
          s = p.read_text(encoding='utf-8')
          old = '\n'.join([
              '        } catch (error) {',
              '          if (attempt !== speechAttemptRef.current || !enabledRef.current) return;',
              '          stopServerAudio(); setActiveSpeakingId(null);',
              '          setVoiceState("ERROR"); setErrorMessage(voiceErrorMessage(error));',
              '        } finally {',
          ])
          new = '\n'.join([
              '        } catch (error) {',
              '          if (attempt !== speechAttemptRef.current || !enabledRef.current) return;',
              '          stopServerAudio(); setActiveSpeakingId(null);',
              '',
              '          // Keep Angela audible when Gemini TTS is quota-limited or temporarily unavailable.',
              '          const browserVoice = voices.find(matchesBangla);',
              '          if (browserVoice) {',
              '            utterance.voice = browserVoice;',
              '            utterance.lang = browserVoice.lang;',
              '          } else {',
              '            // Let the browser choose its best Bengali-capable voice if no explicit match is exposed.',
              '            utterance.lang = "bn-BD";',
              '          }',
              '          currentUtteranceRef.current = utterance;',
              '          utterance.onstart = () => {',
              '            if (currentUtteranceRef.current !== utterance) return;',
              '            setVoiceState("SPEAKING");',
              '            setErrorMessage(null);',
              '            if (messageId) setActiveSpeakingId(messageId);',
              '          };',
              '          utterance.onend = () => {',
              '            if (currentUtteranceRef.current !== utterance) return;',
              '            currentUtteranceRef.current = null;',
              '            setVoiceState("READY");',
              '            setActiveSpeakingId(null);',
              '          };',
              '          utterance.onerror = (event) => {',
              '            if (currentUtteranceRef.current !== utterance) return;',
              '            currentUtteranceRef.current = null;',
              '            setActiveSpeakingId(null);',
              '            if (event.error === "canceled" || event.error === "interrupted") {',
              '              setVoiceState("READY");',
              '              return;',
              '            }',
              '            setVoiceState("ERROR");',
              '            setErrorMessage(voiceErrorMessage(error));',
              '          };',
              '          window.speechSynthesis.speak(utterance);',
              '          return;',
              '        } finally {',
          ])
          if new in s:
              print('Angela browser voice fallback already present')
          elif old not in s:
              raise SystemExit('Target Angela server-speech catch block not found')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate application
        run: |
          npm ci
          npm run lint
          npm run check:seo
          npm run build
          grep -F 'Keep Angela audible when Gemini TTS is quota-limited' src/components/AIChatAssistant.tsx

      - name: Commit fallback patch
        run: |
          if git diff --quiet -- src/components/AIChatAssistant.tsx; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AIChatAssistant.tsx
          git commit -m "fix: fall back to browser speech when Angela TTS is unavailable"
          git push origin HEAD:main
