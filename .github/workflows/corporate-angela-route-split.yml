name: Corporate Angela Route Split Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/corporate-angela-route-split.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare custom and Pages endpoints
        shell: bash
        run: |
          set -u
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          probe() {
            label="$1"
            base="$2"
            safe="$(echo "$label" | tr -cd '[:alnum:]_-')"
            echo "=== $label $base ==="

            chat_status="$(curl --silent --show-error --max-time 25 \
              -H 'Content-Type: application/json' -H "Origin: $base" \
              --data '{"message":"can u talk to bengla","language":"bn","history":[]}' \
              -o "$tmp/$safe-chat" -w '%{http_code}' "$base/angela/chat?diag=split" || true)"
            echo "${label}_CHAT_STATUS=$chat_status"
            python - "$tmp/$safe-chat" "$label" <<'PY' || true
import json,sys,re
p,label=sys.argv[1],sys.argv[2]
try:
    d=json.load(open(p,encoding='utf-8'))
    r=str(d.get('reply') or d.get('response') or '')
    print(f'{label}_CHAT_MODE={d.get("mode")}')
    print(f'{label}_CHAT_INTENT={d.get("primaryIntent")}')
    print(f'{label}_CHAT_HAS_BN={bool(re.search(r"[\u0980-\u09ff]",r))}')
    print(f'{label}_CHAT_CAN_SPEAK={("বাংলা" in r) or ("bangla" in r.lower()) or ("banglish" in r.lower())}')
    print(f'{label}_CHAT_REPLY={r[:220].replace(chr(10)," ")}')
except Exception as e:
    print(f'{label}_CHAT_PARSE={type(e).__name__}')
PY

            live_status="$(curl --silent --show-error --max-time 20 \
              -H 'Content-Type: application/json' -H "Origin: $base" \
              --data '{}' -o "$tmp/$safe-live" -w '%{http_code}' \
              "$base/angela/live-token?diag=split" || true)"
            echo "${label}_LIVE_STATUS=$live_status"
            python - "$tmp/$safe-live" "$label" <<'PY' || true
import json,sys
p,label=sys.argv[1],sys.argv[2]
try:
    d=json.load(open(p,encoding='utf-8'))
    print(f'{label}_LIVE_ERROR={d.get("error")}')
    print(f'{label}_LIVE_MODEL={d.get("model")}')
    print(f'{label}_LIVE_TOKEN_PRESENT={bool(d.get("token"))}')
except Exception as e:
    print(f'{label}_LIVE_PARSE={type(e).__name__}')
PY

            speech_status="$(curl --silent --show-error --max-time 25 \
              -H 'Content-Type: application/json' -H "Origin: $base" \
              --data '{"text":"আসসালামু আলাইকুম। আমি অ্যাঞ্জেলা।","language":"bn"}' \
              -D "$tmp/$safe-headers" -o "$tmp/$safe-speech" -w '%{http_code}' \
              "$base/angela/speech?diag=split" || true)"
            echo "${label}_SPEECH_STATUS=$speech_status"
            echo "${label}_SPEECH_BYTES=$(wc -c < "$tmp/$safe-speech")"
            echo "${label}_SPEECH_TYPE=$(grep -i '^content-type:' "$tmp/$safe-headers" | tail -1 | tr -d '\r' || true)"
          }

          probe CUSTOM "https://journeyexpertltd.com"
          probe CANONICAL "https://ba7643eb.journey-expert-ltd-main.pages.dev"
          probe PAGES "https://journey-expert-ltd-main.pages.dev"