name: Corporate Angela Route Split Diagnostic
# live-token 400 fallback final probe
# final production rerun current canonical 2026-09-30

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/corporate-angela-route-split.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare custom and Pages endpoints
        shell: bash
        run: |
          set -u
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          probe() {
            label="$1"
            base="$2"
            safe="$(echo "$label" | tr -cd '[:alnum:]_-')"
            echo "=== $label $base ==="

            chat_status="$(curl --silent --show-error --max-time 25 -H 'Content-Type: application/json' -H "Origin: $base" --data '{"message":"can u talk to bengla","language":"bn","history":[]}' -o "$tmp/$safe-chat" -w '%{http_code}' "$base/angela/chat?diag=split" || true)"
            echo "${label}_CHAT_STATUS=$chat_status"
            echo "${label}_CHAT_MODE=$(jq -r '.mode // ""' "$tmp/$safe-chat" 2>/dev/null || true)"
            echo "${label}_CHAT_INTENT=$(jq -r '.primaryIntent // ""' "$tmp/$safe-chat" 2>/dev/null || true)"
            reply="$(jq -r '.reply // .response // ""' "$tmp/$safe-chat" 2>/dev/null || true)"
            if printf '%s' "$reply" | grep -Pq '[\x{0980}-\x{09FF}]'; then echo "${label}_CHAT_HAS_BN=true"; else echo "${label}_CHAT_HAS_BN=false"; fi
            if printf '%s' "$reply" | grep -Eqi 'বাংলা|bangla|banglish'; then echo "${label}_CHAT_CAN_SPEAK=true"; else echo "${label}_CHAT_CAN_SPEAK=false"; fi

            live_status="$(curl --silent --show-error --max-time 20 -H 'Content-Type: application/json' -H "Origin: $base" --data '{}' -o "$tmp/$safe-live" -w '%{http_code}' "$base/angela/live-token?diag=split" || true)"
            echo "${label}_LIVE_STATUS=$live_status"
            echo "${label}_LIVE_ERROR=$(jq -r '.error // ""' "$tmp/$safe-live" 2>/dev/null || true)"
            echo "${label}_LIVE_PROVIDER_STATUSES=$(jq -c '.providerStatuses // []' "$tmp/$safe-live" 2>/dev/null || true)"
            echo "${label}_LIVE_MODEL=$(jq -r '.model // ""' "$tmp/$safe-live" 2>/dev/null || true)"
            if jq -e '.token | type == "string" and length > 0' "$tmp/$safe-live" >/dev/null 2>&1; then echo "${label}_LIVE_TOKEN_PRESENT=true"; else echo "${label}_LIVE_TOKEN_PRESENT=false"; fi

            speech_status="$(curl --silent --show-error --max-time 25 -H 'Content-Type: application/json' -H "Origin: $base" --data '{"text":"আসসালামু আলাইকুম। আমি অ্যাঞ্জেলা।","language":"bn"}' -D "$tmp/$safe-headers" -o "$tmp/$safe-speech" -w '%{http_code}' "$base/angela/speech?diag=split" || true)"
            echo "${label}_SPEECH_STATUS=$speech_status"
            echo "${label}_SPEECH_BYTES=$(wc -c < "$tmp/$safe-speech")"
            echo "${label}_SPEECH_TYPE=$(grep -i '^content-type:' "$tmp/$safe-headers" | tail -1 | tr -d '\r' || true)"
          }

          probe CUSTOM "https://journeyexpertltd.com"
          probe CANONICAL "https://38730d7b.journey-expert-ltd-main.pages.dev"
          probe PAGES "https://journey-expert-ltd-main.pages.dev"