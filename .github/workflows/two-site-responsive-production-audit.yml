name: Two-site production responsive audit

on:
  push:
    branches:
      - "verify/responsive-two-sites-20260923"

permissions:
  contents: read

jobs:
  responsive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up browser audit
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p /tmp/jel-responsive-audit
          cd /tmp/jel-responsive-audit
          npm init -y >/dev/null 2>&1
          npm install --no-save --silent puppeteer-core@24.16.0

      - name: Audit live responsive layouts
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/jel-responsive-audit
          cat > audit.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');

          const sites = [
            {
              name: 'JEL Study Abroad',
              base: 'https://journeyexpertbd.com',
              paths: ['/', '/about', '/services', '/destinations', '/contact', '/booking', '/study-abroad/apply', '/finder', '/checker', '/ects-calculator']
            },
            {
              name: 'Journey Expert Ltd',
              base: 'https://journeyexpertltd.com',
              paths: ['/', '/flights', '/visa', '/study-abroad', '/hajj-umrah']
            }
          ];

          const viewports = [
            { name: 'mobile-360', width: 360, height: 800, isMobile: true, hasTouch: true },
            { name: 'mobile-390', width: 390, height: 844, isMobile: true, hasTouch: true },
            { name: 'tablet-768', width: 768, height: 1024, isMobile: false, hasTouch: true },
            { name: 'desktop-1440', width: 1440, height: 900, isMobile: false, hasTouch: false }
          ];

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu']
          });

          const failures = [];
          const results = [];

          for (const site of sites) {
            for (const vp of viewports) {
              const page = await browser.newPage();
              await page.setViewport(vp);
              const pageErrors = [];
              page.on('pageerror', err => pageErrors.push(String(err.message || err)));
              for (const path of site.paths) {
                const url = site.base + path;
                let status = 0;
                let audit = {};
                try {
                  const response = await page.goto(url, { waitUntil: 'networkidle2', timeout: 30000 });
                  status = response ? response.status() : 0;
                  audit = await page.evaluate(() => {
                    const de = document.documentElement;
                    const body = document.body;
                    const width = window.innerWidth;
                    const scrollWidth = Math.max(de.scrollWidth, body?.scrollWidth || 0);
                    const metaViewport = document.querySelector('meta[name="viewport"]')?.getAttribute('content') || '';
                    const main = document.querySelector('main, [role="main"], #root');
                    const buttons = [...document.querySelectorAll('button,a')].filter(el => {
                      const r = el.getBoundingClientRect();
                      const s = getComputedStyle(el);
                      return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.display !== 'none';
                    }).length;
                    const fixed = [...document.querySelectorAll('*')].filter(el => getComputedStyle(el).position === 'fixed').length;
                    return {
                      width,
                      scrollWidth,
                      overflow: scrollWidth > width + 2,
                      metaViewport,
                      hasMain: !!main,
                      visibleActions: buttons,
                      fixedElements: fixed,
                      title: document.title
                    };
                  });
                } catch (e) {
                  failures.push({ site: site.name, viewport: vp.name, path, reason: 'navigation', detail: String(e.message || e) });
                  continue;
                }

                const row = {site: site.name, viewport: vp.name, path, status, ...audit, pageErrors: [...pageErrors]};
                results.push(row);

                if (status < 200 || status >= 400) failures.push({...row, reason: 'http-status'});
                if (!audit.metaViewport.toLowerCase().includes('width=device-width')) failures.push({...row, reason: 'viewport-meta'});
                if (audit.overflow) failures.push({...row, reason: 'horizontal-overflow'});
                if (!audit.hasMain) failures.push({...row, reason: 'missing-main'});
                if (audit.visibleActions < 1) failures.push({...row, reason: 'no-visible-navigation-or-action'});
              }
              await page.close();
            }
          }

          await browser.close();

          console.log(JSON.stringify({results, failures}, null, 2));
          if (failures.length) {
            console.error('RESPONSIVE_AUDIT_FAILED=' + failures.length);
            process.exit(1);
          }
          console.log('RESPONSIVE_AUDIT_PASSED=' + results.length);
          NODE
          node audit.cjs

      - name: Publish audit summary
        if: always()
        run: |
          {
            echo "## JEL Two-Site Responsive Production Audit"
            echo ""
            echo "- Sites: journeyexpertbd.com and journeyexpertltd.com"
            echo "- Viewports: 360x800, 390x844, 768x1024, 1440x900"
            echo "- Checks: HTTP load, viewport metadata, horizontal overflow, main app content, visible actions/navigation, browser page errors."
            echo "- This workflow is read-only against production."
          } >> "$GITHUB_STEP_SUMMARY"
