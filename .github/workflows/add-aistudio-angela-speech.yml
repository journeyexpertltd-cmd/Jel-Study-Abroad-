name: Add AI Studio Angela Speech

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Angela speech endpoint to AI Studio server
        env:
          PATCH_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')
          marker = '// Angela AI Voice Assistant endpoint proxy'
          if 'app.post("/angela/speech"' in s:
              print('AI Studio Angela speech route already present')
          elif marker not in s:
              raise SystemExit('Could not locate Angela insertion marker')
          else:
              block = base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
              p.write_text(s.replace(marker, block + marker, 1), encoding='utf-8')
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run check:seo
          npm run build
          grep -F 'app.post("/angela/speech"' server.ts

      - name: Commit preview speech route
        run: |
          if git diff --quiet -- server.ts; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix: add Angela speech endpoint to AI Studio preview"
          git push origin HEAD:main
