name: Add AI Studio Angela Speech

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Angela speech endpoint to AI Studio server
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')
          marker = '// Angela AI Voice Assistant endpoint proxy'
          if 'app.post("/angela/speech"' in s:
              print('AI Studio Angela speech route already present')
          elif marker not in s:
              raise SystemExit('Could not locate Angela insertion marker')
          else:
              block = '''// Angela speech bridge for Google AI Studio preview/runtime.
          app.post("/angela/speech", async (req, res) => {
            const text = typeof req.body?.text === "string" ? req.body.text.trim() : "";
            if (!text) return res.status(400).json({ error: "text_required" });
            if (text.length > 1800) return res.status(413).json({ error: "text_too_long" });
            try {
              const upstream = await fetch("https://journeyexpertbd.com/angela/speech", {
                method: "POST",
                signal: AbortSignal.timeout(30000),
                headers: {
                  "Content-Type": "application/json",
                  "Origin": "https://journeyexpertbd.com"
                },
                body: JSON.stringify({ text })
              });
              const contentType = upstream.headers.get("content-type") || "application/json";
              const payload = Buffer.from(await upstream.arrayBuffer());
              res.status(upstream.status);
              res.setHeader("Content-Type", contentType);
              res.setHeader("Cache-Control", "no-store");
              res.setHeader("X-Content-Type-Options", "nosniff");
              return res.send(payload);
            } catch {
              return res.status(503).json({ error: "voice_provider_unavailable" });
            }
          });

          '''
              p.write_text(s.replace(marker, block + marker, 1), encoding='utf-8')
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run check:seo
          npm run build
          grep -F 'app.post("/angela/speech"' server.ts

      - name: Commit preview speech route
        run: |
          if git diff --quiet -- server.ts; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix: add Angela speech endpoint to AI Studio preview"
          git push origin HEAD:main
