name: Attempt Study main branch protection with GITHUB_TOKEN
on:
  push:
    branches:
      - admin-hardening-20261001
permissions:
  contents: read
jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Try repository branch protection API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}'             -X PUT             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/branches/main/protection"             -d '{
              "required_status_checks":{"strict":true,"contexts":["Study Abroad CI"]},
              "enforce_admins":true,
              "required_pull_request_reviews":{"dismiss_stale_reviews":true,"require_code_owner_reviews":false,"required_approving_review_count":1},
              "restrictions":null,
              "required_conversation_resolution":true,
              "allow_force_pushes":false,
              "allow_deletions":false,
              "block_creations":false,
              "required_linear_history":false,
              "lock_branch":false,
              "allow_fork_syncing":false
            }')
          echo "BRANCH_PROTECTION_HTTP=$code"
          cat /tmp/resp.json | python -m json.tool || cat /tmp/resp.json
          test "$code" = "200"
          echo "STUDY_MAIN_PROTECTION=PASS"
