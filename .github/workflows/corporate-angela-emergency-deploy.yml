name: Corporate Angela Guarded Emergency Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/corporate-angela-emergency-deploy.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: corporate-angela-guarded-emergency-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy corporate Angela repair
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "7b0d4036973a06b9cd4622770748a101"
      CORPORATE_SHA: "7d6221132ebb72523e922c76137e20aa19c71bfa"

    steps:
      - name: Checkout validated corporate source
        uses: actions/checkout@v4
        with:
          repository: ezyflyltd-wq/https-github.com-ezyflyltd-wq-Journey-Expert-Ltd
          ref: ${{ env.CORPORATE_SHA }}
          path: corporate
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: corporate/pnpm-lock.yaml

      - name: Install and validate corporate source
        working-directory: corporate
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build:pages
          pnpm run test:free-voice
          grep -q 'retrying cloud female WAV with HTMLAudio' src/components/FreeVoiceAngelaWidget.tsx
          grep -q 'Cloud female playback failed this time' src/components/FreeVoiceAngelaWidget.tsx
          grep -q 'independent same-brand female TTS path' functions/angela/speech.ts
          grep -q 'independent JEL Study Abroad brain' functions/angela/chat.ts

      - name: Verify Cloudflare credential
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "Cloudflare Pages deployment credential is available."

      - name: Deploy guarded preview
        id: preview
        working-directory: corporate
        run: |
          set -euo pipefail
          log="$(mktemp)"
          npx --yes wrangler@4 pages deploy dist             --project-name=journey-expert-ltd-main             --branch=chatgpt-angela-female-fix             --commit-hash="$CORPORATE_SHA" 2>&1 | tee "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "$log" | tail -n1 || true)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview exact build
        working-directory: corporate
        run: |
          set -euo pipefail
          url="${{ steps.preview.outputs.url }}"
          curl --fail --silent --show-error --max-time 25 "$url/api/health" >/dev/null

          live_html="$(mktemp)"
          trap 'rm -f "$live_html"' EXIT
          curl --fail --silent --show-error --location --max-time 20 "$url/?build=$CORPORATE_SHA" -o "$live_html"

          local_script="$(grep -oE 'src="[^"]+\.js' dist/index.html | head -n1 | sed 's/^src="//')"
          remote_script="$(grep -oE 'src="[^"]+\.js' "$live_html" | head -n1 | sed 's/^src="//')"
          test -n "$local_script"
          test "$remote_script" = "$local_script"
          echo "PREVIEW_EXACT_BUILD=true script=$remote_script"

      - name: Deploy production release
        working-directory: corporate
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist             --project-name=journey-expert-ltd-main             --branch=release             --commit-hash="$CORPORATE_SHA"

      - name: Verify public production repair
        working-directory: corporate
        run: |
          set -euo pipefail
          base="https://journeyexpertltd.com"
          local_script="$(grep -oE 'src="[^"]+\.js' dist/index.html | head -n1 | sed 's/^src="//')"
          test -n "$local_script"

          html="$(mktemp)"
          en="$(mktemp)"
          bn="$(mktemp)"
          wav="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$html" "$en" "$bn" "$wav" "$headers"' EXIT

          # Allow the Pages custom domain/CDN a bounded propagation window.
          exact_build=false
          for attempt in 1 2 3 4 5 6; do
            nonce="$(date +%s)-$attempt"
            curl --fail --silent --show-error --location --max-time 20               -H 'Cache-Control: no-cache' "$base/?build=$CORPORATE_SHA&n=$nonce" -o "$html"
            remote_script="$(grep -oE 'src="[^"]+\.js' "$html" | head -n1 | sed 's/^src="//' || true)"
            echo "Production asset attempt $attempt: $remote_script"
            if [ "$remote_script" = "$local_script" ]; then
              exact_build=true
              break
            fi
            sleep 10
          done
          test "$exact_build" = true
          echo "PUBLIC_EXACT_BUILD=true script=$local_script"

          curl --fail --silent --show-error --max-time 25 "$base/api/health" >/dev/null

          curl --fail --silent --show-error --max-time 30             -H 'Content-Type: application/json' -H "Origin: $base"             --data '{"message":"What services does Journey Expert Limited provide?","language":"en","history":[]}'             "$base/angela/chat" -o "$en"
          grep -q '"primaryIntent":"services_overview"' "$en"
          grep -Eqi 'air ticketing|visa-document|Hajj|Study Abroad' "$en"
          grep -qi 'Craft Bangla' "$en"

          curl --fail --silent --show-error --max-time 30             -H 'Content-Type: application/json' -H "Origin: $base"             --data '{"message":"Journey Expert Limited-এর কী কী সার্ভিস আছে?","language":"bn","history":[]}'             "$base/angela/chat" -o "$bn"
          grep -q '"primaryIntent":"services_overview"' "$bn"
          grep -Pq '[\x{0980}-\x{09FF}]' "$bn"
          grep -qi 'Craft Bangla' "$bn"

          curl --fail --silent --show-error --max-time 35             -H 'Content-Type: application/json' -H "Origin: $base"             --data '{"text":"আসসালামু আলাইকুম। আমি অ্যাঞ্জেলা।","language":"bn"}'             -D "$headers" "$base/angela/speech" -o "$wav"
          grep -Eqi '^content-type: audio/' "$headers"
          test "$(wc -c < "$wav")" -gt 1000
          echo "PUBLIC_FEMALE_AUDIO_BYTES=$(wc -c < "$wav")"
          echo "PUBLIC_PRODUCTION_REPAIR_VERIFIED=true"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Corporate Angela Guarded Emergency Deploy"
            echo "- Source repository: ezyflyltd-wq/https-github.com-ezyflyltd-wq-Journey-Expert-Ltd"
            echo "- Source SHA: $CORPORATE_SHA"
            echo "- Cloudflare project: journey-expert-ltd-main"
            echo "- Production branch: release"
            echo "- Validation includes type-check, build, Angela regressions, preview chat, Bangla, female audio and repaired browser bundle."
          } >> "$GITHUB_STEP_SUMMARY"
