name: Apply AI Studio Live Token

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused server patch
        run: node scripts/patch-aistudio-live-token.mjs
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run check:seo
          npm run build
      - name: Commit source change
        run: |
          if git diff --quiet -- server.ts; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "feat: keep AI Studio Live voice fallback in parity with production"
          git push origin HEAD:main
