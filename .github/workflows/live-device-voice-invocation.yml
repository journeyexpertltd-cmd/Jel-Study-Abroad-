name: Live device voice invocation verification
on:
  push:
    branches: ["verify/live-device-voice-invocation-20260923"]
permissions:
  contents: read

jobs:
  verify-live-device-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser harness
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p /tmp/jel-voice-live
          cd /tmp/jel-voice-live
          npm init -y >/dev/null 2>&1
          npm install --no-save --silent puppeteer-core@24.16.0

      - name: Click live Angela and verify speech API invocation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/jel-voice-live
          cat > verify.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--autoplay-policy=no-user-gesture-required']
            });

            async function prepare(page) {
              await page.evaluateOnNewDocument(() => {
                window.__angelaSpoken = [];
                const synth = window.speechSynthesis;
                if (!synth) return;
                const fakeSpeak = (utterance) => {
                  window.__angelaSpoken.push({
                    text: String(utterance?.text || ''),
                    lang: String(utterance?.lang || '')
                  });
                  if (typeof utterance?.onstart === 'function') {
                    setTimeout(() => utterance.onstart(new Event('start')), 0);
                  }
                  if (typeof utterance?.onend === 'function') {
                    setTimeout(() => utterance.onend(new Event('end')), 30);
                  }
                };
                try { Object.defineProperty(synth, 'speak', { configurable: true, value: fakeSpeak }); }
                catch { try { synth.speak = fakeSpeak; } catch {} }
                try { Object.defineProperty(synth, 'getVoices', { configurable: true, value: () => [] }); }
                catch { try { synth.getVoices = () => []; } catch {} }
                try { Object.defineProperty(synth, 'cancel', { configurable: true, value: () => {} }); } catch {}
                try { Object.defineProperty(synth, 'resume', { configurable: true, value: () => {} }); } catch {}
              });
            }

            async function study() {
              const page = await browser.newPage();
              await prepare(page);
              const response = await page.goto('https://journeyexpertbd.com/?voicecheck=20260923', {waitUntil:'networkidle2', timeout:30000});
              if (!response || response.status() >= 400) throw new Error('Study page failed HTTP ' + (response?.status() || 0));
              await page.waitForSelector('#btn-open-angela-assistant', {visible:true, timeout:15000});
              await page.click('#btn-open-angela-assistant');
              await page.waitForFunction(() => Array.isArray(window.__angelaSpoken) && window.__angelaSpoken.length > 0, {timeout:7000});
              const spoken = await page.evaluate(() => window.__angelaSpoken);
              console.log('STUDY_SPEECH_CALL=' + JSON.stringify(spoken[0]));
              if (!spoken[0]?.text) throw new Error('Study Angela did not invoke device speech');
              await page.close();
            }

            async function corporate() {
              const page = await browser.newPage();
              await prepare(page);
              const response = await page.goto('https://journeyexpertltd.com/?voicecheck=20260923', {waitUntil:'networkidle2', timeout:30000});
              if (!response || response.status() >= 400) throw new Error('Corporate page failed HTTP ' + (response?.status() || 0));
              await page.waitForSelector('[aria-label="Open free Angela voice assistant"]', {visible:true, timeout:15000});
              await page.click('[aria-label="Open free Angela voice assistant"]');
              await page.waitForFunction(() => [...document.querySelectorAll('button')].some(b => b.textContent?.includes('Agree and continue')), {timeout:7000});
              const buttons = await page.$$('button');
              let clicked = false;
              for (const button of buttons) {
                const text = await page.evaluate(el => el.textContent || '', button);
                if (text.includes('Agree and continue')) {
                  await button.click();
                  clicked = true;
                  break;
                }
              }
              if (!clicked) throw new Error('Corporate disclosure continue button not found');
              await page.waitForFunction(() => Array.isArray(window.__angelaSpoken) && window.__angelaSpoken.length > 0, {timeout:7000});
              const spoken = await page.evaluate(() => window.__angelaSpoken);
              console.log('CORPORATE_SPEECH_CALL=' + JSON.stringify(spoken[0]));
              if (!spoken[0]?.text) throw new Error('Corporate Angela did not invoke device speech');
              await page.close();
            }

            await study();
            await corporate();
            await browser.close();
            console.log('LIVE_DEVICE_VOICE_INVOCATION=PASS');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node verify.cjs
