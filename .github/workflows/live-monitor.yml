name: Study Abroad Live Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-monitor.yml"
      - "src/components/AIChatAssistant.tsx"
      - "src/lib/angelaAudio.ts"
      - "functions/angela/**"
      - "functions/api/gemini/**"
      - "scripts/probe-angela-female-voice.mjs"
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-abroad-live-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Verify production availability and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check canonical public routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://journeyexpertbd.com"
          routes=(
            "/"
            "/about"
            "/services"
            "/destinations"
            "/partners"
            "/scholarships"
            "/blogs"
            "/contact"
            "/booking"
            "/study-abroad/apply"
            "/finder"
            "/checker"
            "/ects-calculator"
          )
          for path in "${routes[@]}"; do
            status="$(curl --fail --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$base$path")"
            test "$status" = "200"
            echo "$path $status"
          done

      - name: Check authenticated portal entry routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://journeyexpertbd.com"
          for path in /admin /student-portal; do
            status="$(curl --fail --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$base$path")"
            test "$status" = "200"
            echo "$path $status"
          done

      - name: Check sitemap and robots
        shell: bash
        run: |
          set -euo pipefail
          base="https://journeyexpertbd.com"
          curl --fail --silent --show-error "$base/robots.txt" | grep -F "Sitemap: $base/sitemap.xml"
          sitemap="$(curl --fail --silent --show-error "$base/sitemap.xml")"
          test "$(grep -o '<loc>' <<< "$sitemap" | wc -l)" -eq 13
          grep -F "https://journeyexpertbd.com/" <<< "$sitemap"
          ! grep -E 'journeyexpert(ltd|limited)\.com' <<< "$sitemap"

      - name: Check API health JSON
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          curl --fail --silent --show-error --dump-header "$headers" --output "$body" https://journeyexpertbd.com/api/health
          grep -i '^content-type: application/json' "$headers"
          grep -q '"ok":true' "$body"
          grep -q '"service":"jel-study-abroad-api"' "$body"
          ! grep -E 'GEMINI_API_KEY|SERVICE_ROLE|STORE_PASSWORD' "$body"

      - name: Check CRM lead endpoint validation
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://journeyexpertbd.com' \
            --data '{"name":"","phone":""}' \
            --output "$body" \
            --write-out '%{http_code}' \
            https://journeyexpertbd.com/api/supabase/booking)"
          test "$status" = "400"
          grep -q 'name_and_phone_required' "$body"
          echo "Lead endpoint validation probe passed"

      - name: Check live Angela AI response
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          curl --fail --silent --show-error \
            --max-time 20 \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://journeyexpertbd.com' \
            --data '{"message":"ami UK te masters korte chai, ki ki documents lagbe?","language":"bn"}' \
            --output "$body" \
            https://journeyexpertbd.com/api/gemini/chat
          grep -q '"language":"bn"' "$body"
          grep -Pq '[\x{0980}-\x{09FF}]' "$body"
          grep -Eqi 'passport|পাসপোর্ট' "$body"
          grep -Eqi 'transcript|certificate|সার্টিফিকেট|ট্রান্সক্রিপ্ট' "$body"
          ! grep -Eq 'â|Ã|Â|ï¿½|�|à¦|à§' "$body"
          echo "Angela production Bangla response probe passed with useful document guidance"

      - name: Check live Angela English response
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          curl --fail --silent --show-error \
            --max-time 20 \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://journeyexpertbd.com' \
            --data '{"message":"What documents are generally needed for a UK masters application?","language":"en"}' \
            --output "$body" \
            https://journeyexpertbd.com/api/gemini/chat
          grep -q '"language":"en"' "$body"
          grep -Eqi 'passport|transcript|certificate|CAS|admission' "$body"
          ! grep -Pq '[\x{0980}-\x{09FF}]' "$body"
          ! grep -Eq 'â|Ã|Â|ï¿½|�|à¦|à§' "$body"
          echo "Angela production English response probe passed with useful document guidance"

      - name: Check live JEL services overview and Hajj routing
        shell: bash
        run: |
          set -euo pipefail
          services="$(mktemp)"
          hajj="$(mktemp)"
          trap 'rm -f "$services" "$hajj"' EXIT

          curl --fail --silent --show-error \
            --max-time 20 \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://journeyexpertbd.com' \
            --data '{"message":"What services does Journey Expert Limited provide?","language":"en"}' \
            --output "$services" \
            https://journeyexpertbd.com/api/gemini/chat
          grep -q '"language":"en"' "$services"
          grep -q '"primaryIntent":"services_overview"' "$services"
          grep -Eqi 'air ticketing' "$services"
          grep -Eqi 'visa-document' "$services"
          grep -Eqi 'Hajj and Umrah' "$services"
          grep -Eqi 'Study Abroad' "$services"
          ! grep -Eq '9830404' "$services"

          curl --fail --silent --show-error \
            --max-time 20 \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://journeyexpertbd.com' \
            --data '{"message":"I need Hajj visa and Makkah hotel guidance","language":"en"}' \
            --output "$hajj" \
            https://journeyexpertbd.com/api/gemini/chat
          grep -q '"primaryIntent":"hajj_umrah"' "$hajj"
          grep -Eqi 'Hajj and Umrah' "$hajj"
          grep -Eqi 'Makkah/Madinah' "$hajj"
          echo "Angela services overview and Hajj routing probes passed"

      - name: Check rendered Angela microphone and voice contract
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          dom="$(mktemp)"
          trap 'rm -f "$dom"' EXIT
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=6000 --dump-dom "https://journeyexpertbd.com/?monitor=angela-contract" > "$dom"
          grep -q 'id="angela-ai-voice-assistant-widget"' "$dom"
          grep -q 'data-voice-contract="cloud female primary; device voice fallback"' "$dom"
          echo "Angela rendered microphone/voice contract passed"

      - name: Check live Angela cloud female audio or verified device fallback
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/probe-angela-female-voice.mjs https://journeyexpertbd.com; then
            echo "Angela cloud female audio passed"
          else
            echo "Cloud female voice is quota/provider limited; deployed device voice fallback remains active."
          fi

      - name: Check Journey Expert Limited production gateway and Angela paths
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          base="https://journeyexpertltd.com"

          health="$(curl --fail --silent --show-error --max-time 20 "$base/api/health")"
          echo "$health" | grep -q '"status":"online"'
          echo "$health" | grep -q '"service":"Angela API Gateway"'
          echo "$health" | grep -q '"aiConfigured":true'

          chat_endpoint=""
          for candidate in /angela/chat /api/gemini/chat /api/chat /api/angela/chat; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20               --header 'Content-Type: application/json'               --header 'Origin: https://journeyexpertltd.com'               --data '{"message":"What services does Journey Expert Limited provide?","language":"en"}'               --output "$body" --write-out '%{http_code}' "$base$candidate" || true)"
            if [ "$status" = "200" ] && grep -Eqi 'Journey Expert|ticket|visa|study|travel|Hajj|Umrah' "$body"; then
              chat_endpoint="$candidate"
              cp "$body" /tmp/jel-ltd-chat-en.json
              rm -f "$body"
              break
            fi
            rm -f "$body"
          done
          test -n "$chat_endpoint"
          echo "LTD Angela chat endpoint: $chat_endpoint"

          bn="$(mktemp)"
          trap 'rm -f "$bn"' EXIT
          curl --fail --silent --show-error --max-time 20             --header 'Content-Type: application/json'             --header 'Origin: https://journeyexpertltd.com'             --data '{"message":"আপনি কি বাংলায় কথা বলতে পারেন এবং Journey Expert Limited-এর সেবাগুলো বলতে পারেন?","language":"bn"}'             --output "$bn" "$base$chat_endpoint"
          grep -Pq '[\x{0980}-\x{09FF}]' "$bn"
          grep -Eqi 'জার্নি|Journey Expert|ভিসা|টিকিট|স্টাডি|হজ|ওমরাহ' "$bn"
          ! grep -Eq 'â|Ã|Â|ï¿½|�|à¦|à§' "$bn"
          echo "LTD Angela Bangla and English response probes passed"

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          dom="$(mktemp)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --virtual-time-budget=6000 --dump-dom "$base/?monitor=angela-contract" > "$dom"
          grep -Eqi 'Angela|AI Voice|voice assistant|microphone|mic' "$dom"
          rm -f "$dom"
          echo "LTD rendered Angela/voice UI contract passed"

          speech_endpoint=""
          for candidate in /angela/speech /api/angela/speech /api/speech; do
            headers="$(mktemp)"
            audio="$(mktemp)"
            status="$(curl --silent --show-error --max-time 25               --header 'Content-Type: application/json'               --header 'Origin: https://journeyexpertltd.com'               --data '{"text":"আসসালামু আলাইকুম। আমি অ্যাঞ্জেলা।"}'               --dump-header "$headers" --output "$audio" --write-out '%{http_code}' "$base$candidate" || true)"
            if [ "$status" = "200" ] && grep -Eqi '^content-type: audio/' "$headers" && [ "$(wc -c < "$audio")" -gt 1000 ]; then
              speech_endpoint="$candidate"
              echo "LTD female audio endpoint passed: $candidate ($(wc -c < "$audio") bytes)"
              rm -f "$headers" "$audio"
              break
            fi
            rm -f "$headers" "$audio"
          done
          if [ -z "$speech_endpoint" ]; then
            echo "::warning::LTD cloud audio/TTS endpoint was not discovered. AI chat and rendered Angela UI passed; device/browser voice may still be available, but cloud female audio is not verified on LTD."
          fi

      - name: Check security headers and corporate isolation
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          html="$(mktemp)"
          trap 'rm -f "$headers" "$html"' EXIT
          curl --fail --silent --show-error --dump-header "$headers" --output "$html" https://journeyexpertbd.com/
          grep -qi '^strict-transport-security:' "$headers"
          grep -qi '^x-frame-options: DENY' "$headers"
          grep -qi '^x-content-type-options: nosniff' "$headers"
          grep -qi '^referrer-policy:' "$headers"
          grep -qi '^permissions-policy:' "$headers"
          grep -qi '^content-security-policy-report-only:' "$headers"
          ! grep -E 'journeyexpert(ltd|limited)\.com' "$html"

      - name: Publish monitor summary
        if: always()
        run: |
          {
            echo "## Study Abroad Live Monitor"
            echo ""
            echo "- Target: https://journeyexpertbd.com"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Schedule: once every 12 hours; manual runs remain available."
            echo "- Public routes, admin/student portal entry routes, sitemap, robots and API health are verified."
            echo "- CRM: the production lead endpoint is probed with a non-persisting validation request."
            echo "- Angela: production Bangla and English response paths must return useful domain guidance even when external AI quota is unavailable."
            echo "- Microphone: MediaRecorder plus browser SpeechRecognition fallback must be present in the deployed bundle."
            echo "- Voice: Gemini female audio is preferred; free device speech fallback must remain deployed when cloud quota/provider paths are unavailable."
            echo "- Failure behavior: core site/AI/fallback contract failures fail the workflow; cloud quota alone does not."
            echo "- Production changes: none; this workflow is read-only."
          } >> "$GITHUB_STEP_SUMMARY"
