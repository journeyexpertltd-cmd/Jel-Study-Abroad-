name: Study Abroad Live Monitor

on:
  push:
    branches:
      - diag/study-angela-latency-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Measure live Angela text latency
        shell: bash
        run: |
          set -euo pipefail
          for source in voice text; do
            body="$(mktemp)"
            metrics="$(curl --fail --silent --show-error --max-time 15               --header 'Content-Type: application/json'               --header 'Origin: https://journeyexpertbd.com'               --data "$(jq -nc --arg source "$source" '{message:"ami UK te masters korte chai, ki documents lagbe?",language:"auto",source:$source}')"               --output "$body"               --write-out 'code=%{http_code} total=%{time_total} start=%{time_starttransfer}'               https://journeyexpertbd.com/api/gemini/chat)"
            mode="$(jq -r '.mode // ""' "$body")"
            lang="$(jq -r '.language // ""' "$body")"
            model="$(jq -r '.providerModel // ""' "$body")"
            reply="$(jq -r '.reply // ""' "$body")"
            echo "TEXT source=$source $metrics mode=$mode lang=$lang model=$model reply_len=${#reply}"
            test "$mode" = "ai"
            test "$lang" = "bn"
            rm -f "$body"
          done

      - name: Measure live female speech latency
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          audio="$(mktemp)"
          metrics="$(curl --silent --show-error --max-time 30             --dump-header "$headers"             --header 'Content-Type: application/json'             --header 'Origin: https://journeyexpertbd.com'             --data '{"text":"হ্যালো, আমি অ্যাঞ্জেলা।"}'             --output "$audio"             --write-out 'code=%{http_code} total=%{time_total} start=%{time_starttransfer}'             https://journeyexpertbd.com/angela/speech)"
          bytes="$(wc -c < "$audio" | tr -d ' ')"
          echo "TTS $metrics bytes=$bytes"
          grep -qi '^content-type: audio/wav' "$headers"
          test "$bytes" -gt 1000
          test "$(head -c 4 "$audio")" = "RIFF"
