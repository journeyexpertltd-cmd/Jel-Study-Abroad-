name: Final cross-platform Angela production acceptance
on:
  push:
    branches: ["verify/final-cross-platform-angela-20260923"]
permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify live bilingual knowledge paths
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          async function post(url, body) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 20000);
            try {
              const response = await fetch(url, {
                method: 'POST',
                signal: controller.signal,
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(body),
              });
              const text = await response.text();
              let data = {};
              try { data = JSON.parse(text); } catch {}
              if (!response.ok) throw new Error(url + ' HTTP ' + response.status + ' ' + text.slice(0,300));
              return data;
            } finally { clearTimeout(timer); }
          }

          const bengali = /[\u0980-\u09FF]/;
          const corrupt = /â|Ã|Â|ï¿½|�|à¦|à§/;

          const cases = [
            {
              name:'study-bn-ticket',
              url:'https://journeyexpertbd.com/api/gemini/chat',
              body:{message:'এয়ার টিকিট, fare quotation এবং reissue/refund support সম্পর্কে বলুন।', language:'bn', source:'text'},
              lang:'bn',
              terms:/টিকিট|ফ্লাইট|fare|reissue|refund|রিফান্ড/i
            },
            {
              name:'study-en-corporate',
              url:'https://journeyexpertbd.com/api/gemini/chat',
              body:{message:'What corporate travel services does Journey Expert Limited provide?', language:'en', source:'text'},
              lang:'en',
              terms:/corporate|travel|ticket|hotel|Journey Expert/i
            },
            {
              name:'corporate-bn-services',
              url:'https://journeyexpertltd.com/angela/chat',
              body:{message:'Journey Expert Limited কী কী সেবা দেয়?', language:'bn', history:[]},
              lang:'bn',
              terms:/টিকিট|ভিসা|ট্যুর|হজ|ওমরাহ|Study Abroad|কর্পোরেট/i
            },
            {
              name:'corporate-en-study',
              url:'https://journeyexpertltd.com/angela/chat',
              body:{message:'How can JEL Study Abroad help a student?', language:'en', history:[]},
              lang:'en',
              terms:/study|university|admission|student|course|scholarship/i
            },
          ];

          for (const tc of cases) {
            const data = await post(tc.url, tc.body);
            const reply = String(data.reply || '');
            if (!reply || reply.length < 20) throw new Error(tc.name + ': missing usable reply');
            if (tc.lang === 'bn' && !bengali.test(reply)) throw new Error(tc.name + ': no Bengali script');
            if (tc.lang === 'en' && bengali.test(reply)) throw new Error(tc.name + ': unexpected Bengali output');
            if (corrupt.test(reply)) throw new Error(tc.name + ': encoding corruption');
            if (!tc.terms.test(reply)) throw new Error(tc.name + ': service content gap: ' + reply.slice(0,400));
            console.log(tc.name + '=PASS mode=' + String(data.mode || 'unknown') + ' reply=' + reply.slice(0,180).replace(/\s+/g,' '));
          }
          NODE

      - name: Classify live cloud female voice availability
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          for (const base of ['https://journeyexpertbd.com','https://journeyexpertltd.com']) {
            const response = await fetch(base + '/angela/speech', {
              method:'POST',
              headers:{'Content-Type':'application/json','Origin':base},
              body:JSON.stringify({text:'আসসালামু আলাইকুম। আমি অ্যাঞ্জেলা।',language:'bn'})
            });
            const ctype = response.headers.get('content-type') || '';
            const bytes = new Uint8Array(await response.arrayBuffer());
            if (response.status === 200) {
              if (!ctype.includes('audio/wav') || bytes.length < 1000) throw new Error(base + ': invalid cloud audio');
              console.log(base + ' CLOUD_FEMALE=AVAILABLE bytes=' + bytes.length);
            } else if ([429,424,503].includes(response.status)) {
              console.log(base + ' CLOUD_FEMALE=FREE_PROVIDER_LIMITED status=' + response.status + ' device-fallback-required');
            } else {
              throw new Error(base + ': unexpected speech status ' + response.status);
            }
          }
          NODE

      - name: Install browser acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p /tmp/jel-cross-platform
          cd /tmp/jel-cross-platform
          npm init -y >/dev/null 2>&1
          npm install --no-save --silent puppeteer-core@24.16.0

      - name: Force quota failure and verify female device fallback across device families
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/jel-cross-platform
          cat > verify.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');

          const profiles = [
            {
              name:'windows-chrome', width:1440, height:900, mobile:false,
              ua:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              voices:[
                {name:'Microsoft Pradeep Online',lang:'bn-IN',default:false,localService:false},
                {name:'Microsoft Nabanita Online (Natural)',lang:'bn-IN',default:false,localService:false},
                {name:'Microsoft Aria Online',lang:'en-US',default:true,localService:false}
              ],
              expected:/nabanita/i
            },
            {
              name:'android-chrome', width:390, height:844, mobile:true,
              ua:'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 Chrome/153 Mobile Safari/537.36',
              voices:[
                {name:'Android Bengali Male',lang:'bn-BD',default:false,localService:true},
                {name:'Google Bangla',lang:'bn-BD',default:true,localService:false},
                {name:'Google English US',lang:'en-US',default:false,localService:false}
              ],
              expected:/google bangla/i
            },
            {
              name:'macos-safari', width:1440, height:900, mobile:false,
              ua:'Mozilla/5.0 (Macintosh; Intel Mac OS X 15_6) AppleWebKit/605.1.15 Version/19.0 Safari/605.1.15',
              voices:[
                {name:'Bengali Male',lang:'bn-IN',default:false,localService:true},
                {name:'Lekha',lang:'bn-IN',default:true,localService:true},
                {name:'Samantha',lang:'en-US',default:false,localService:true}
              ],
              expected:/lekha/i
            },
            {
              name:'iphone-safari', width:390, height:844, mobile:true,
              ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 19_0 like Mac OS X) AppleWebKit/605.1.15 Version/19.0 Mobile/15E148 Safari/604.1',
              voices:[
                {name:'Bengali Male',lang:'bn-IN',default:false,localService:true},
                {name:'Sangeeta',lang:'bn-IN',default:true,localService:true},
                {name:'Samantha',lang:'en-US',default:false,localService:true}
              ],
              expected:/sangeeta/i
            }
          ];

          const sites = [
            {name:'study',url:'https://journeyexpertbd.com/?acceptance=20260923',launcher:'#btn-open-angela-assistant',consent:false},
            {name:'corporate',url:'https://journeyexpertltd.com/?acceptance=20260923',launcher:'[aria-label="Open free Angela voice assistant"]',consent:true},
          ];

          (async () => {
            const browser = await puppeteer.launch({
              executablePath:process.env.CHROME_PATH,
              headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']
            });

            for (const profile of profiles) {
              for (const site of sites) {
                const page = await browser.newPage();
                await page.setUserAgent(profile.ua);
                await page.setViewport({width:profile.width,height:profile.height,isMobile:profile.mobile,hasTouch:profile.mobile});

                await page.evaluateOnNewDocument((voices) => {
                  window.__angelaSpoken = [];
                  class FakeUtterance {
                    constructor(text='') {
                      this.text = String(text); this.lang=''; this.rate=1; this.pitch=1; this.voice=null;
                      this.onstart=null; this.onend=null; this.onerror=null;
                    }
                  }
                  try { Object.defineProperty(window,'SpeechSynthesisUtterance',{configurable:true,value:FakeUtterance}); } catch {}
                  const synth = window.speechSynthesis;
                  if (synth) {
                    try { Object.defineProperty(synth,'getVoices',{configurable:true,value:()=>voices}); } catch {}
                    try { Object.defineProperty(synth,'cancel',{configurable:true,value:()=>{}}); } catch {}
                    try { Object.defineProperty(synth,'resume',{configurable:true,value:()=>{}}); } catch {}
                    try {
                      Object.defineProperty(synth,'speak',{configurable:true,value:(u)=>{
                        window.__angelaSpoken.push({text:String(u.text||''),lang:String(u.lang||''),voice:String(u.voice?.name||'')});
                        setTimeout(()=>u.onstart?.({type:'start'}),0);
                        setTimeout(()=>u.onend?.({type:'end'}),25);
                      }});
                    } catch {}
                  }
                }, profile.voices);

                await page.setRequestInterception(true);
                page.on('request', req => {
                  if (req.url().endsWith('/angela/speech') && req.method() === 'POST') {
                    req.respond({status:429,contentType:'application/json',body:'{"error":"voice_quota_exceeded"}'}).catch(()=>{});
                  } else {
                    req.continue().catch(()=>{});
                  }
                });

                const response = await page.goto(site.url,{waitUntil:'networkidle2',timeout:30000});
                if (!response || response.status() >= 400) throw new Error(profile.name+' '+site.name+': page HTTP '+(response?.status()||0));
                await page.waitForSelector(site.launcher,{visible:true,timeout:15000});
                await page.click(site.launcher);

                if (site.consent) {
                  await page.waitForFunction(()=>[...document.querySelectorAll('button')].some(b=>b.textContent?.includes('Agree and continue')),{timeout:7000});
                  const buttons=await page.$$('button');
                  let clicked=false;
                  for(const button of buttons){
                    const label=await page.evaluate(el=>el.textContent||'',button);
                    if(label.includes('Agree and continue')){await button.click();clicked=true;break;}
                  }
                  if(!clicked) throw new Error(profile.name+' corporate: consent button not found');
                }

                await page.waitForFunction(()=>Array.isArray(window.__angelaSpoken)&&window.__angelaSpoken.length>0,{timeout:9000});
                const result=await page.evaluate(()=>window.__angelaSpoken[0]);
                if (!/[\u0980-\u09FF]/.test(result.text) || !result.text.includes('আসসালামু আলাইকুম') || !result.text.includes('আমি আপনাকে কীভাবে সাহায্য করতে পারি')) {
                  throw new Error(profile.name+' '+site.name+': greeting contract failed '+JSON.stringify(result));
                }
                if (!profile.expected.test(result.voice)) {
                  throw new Error(profile.name+' '+site.name+': expected female voice '+profile.expected+' but got '+result.voice);
                }
                const contract=await page.evaluate(()=>document.querySelector('[data-voice-contract]')?.getAttribute('data-voice-contract')||'');
                if (!contract.includes('cloud female primary') || !contract.includes('device voice fallback')) {
                  throw new Error(profile.name+' '+site.name+': deployed voice contract marker missing');
                }
                console.log(profile.name+' '+site.name+'=PASS voice='+result.voice+' lang='+result.lang);
                await page.close();
              }
            }

            await browser.close();
            console.log('CROSS_PLATFORM_FEMALE_FALLBACK=PASS');
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
          node verify.cjs

      - name: Publish final acceptance summary
        if: always()
        run: |
          {
            echo "## Final cross-platform Angela acceptance"
            echo ""
            echo "- Live sites: journeyexpertbd.com + journeyexpertltd.com"
            echo "- Live bilingual knowledge: Study and corporate service questions in Bangla and English"
            echo "- Voice primary: bounded Journey Expert cloud female WAV when available"
            echo "- Voice resilience: forced cloud 429 and verified ranked Bengali female device fallback"
            echo "- Device-family simulations: Windows Chrome, Android Chrome, macOS Safari profile, iPhone Safari profile"
          } >> "$GITHUB_STEP_SUMMARY"

