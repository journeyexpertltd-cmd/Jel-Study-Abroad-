name: Cloudflare LTD Voice Route Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-ltd-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Inspect journeyexpertltd.com Worker routing
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "7b0d4036973a06b9cd4622770748a101"
    steps:
      - name: Resolve zone and Worker route
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          zones="$(curl --fail --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=journeyexpertltd.com")"
          echo "$zones" | jq -e '.success == true'
          zone_id="$(echo "$zones" | jq -r '.result[0].id // empty')"
          test -n "$zone_id"
          echo "Zone resolved: journeyexpertltd.com"

          routes="$(curl --fail --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes")"
          echo "$routes" | jq -e '.success == true'
          echo "Worker routes:"
          echo "$routes" | jq -r '.result[] | [.pattern, (.script // "<none>")] | @tsv'

          script="$(echo "$routes" | jq -r '[.result[] | select((.pattern|test("journeyexpertltd\\.com")) and (.script != null))][0].script // empty')"
          if [ -z "$script" ]; then
            script="$(echo "$routes" | jq -r '[.result[] | select(.script != null)][0].script // empty')"
          fi
          test -n "$script"
          echo "Active Worker script: $script"
          echo "$script" > /tmp/ltd-worker-script-name

      - name: Inspect active Worker voice/chat routes
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          script="$(cat /tmp/ltd-worker-script-name)"
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT

          curl --fail --silent --show-error "${auth[@]}"             --dump-header "$headers"             --output "$body"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$script"

          echo "Worker script bytes: $(wc -c < "$body")"
          echo "Detected route/code markers:"
          strings "$body" | grep -Eio '/api/[A-Za-z0-9_./:-]+|/angela/[A-Za-z0-9_./:-]+|gemini-[A-Za-z0-9_.-]+|Aoede|speech|tts|voice|chat' | sort -u | head -n 120 || true

          if strings "$body" | grep -Eqi '/angela/speech|/api/angela/speech|/api/speech|text-to-speech|tts|Aoede'; then
            echo "VOICE_ROUTE_OR_TTS_MARKER=present"
          else
            echo "VOICE_ROUTE_OR_TTS_MARKER=absent"
          fi

          if strings "$body" | grep -Eqi '/api/gemini/chat|/api/chat|/api/angela/chat|chat'; then
            echo "CHAT_ROUTE_MARKER=present"
          else
            echo "CHAT_ROUTE_MARKER=absent"
          fi

      - name: Publish audit summary
        if: always()
        run: |
          {
            echo "## Cloudflare LTD Voice Route Audit"
            echo "- Target: journeyexpertltd.com"
            echo "- Mode: read-only Cloudflare API inspection"
            echo "- No DNS, Worker, secret, or route mutation is performed."
          } >> "$GITHUB_STEP_SUMMARY"
